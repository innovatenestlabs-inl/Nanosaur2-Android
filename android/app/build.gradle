plugins {
    id 'com.android.application'
}

def sdlRoot = file('../SDL')
if (!new File(sdlRoot, 'CMakeLists.txt').isFile()) {
    throw new GradleException('SDL3 is missing. From the repository root, run: powershell -ExecutionPolicy Bypass -File android/setup-sdl.ps1')
}

// Explicitly bind the staging task to the Android build lifecycle.
// A generated asset source directory alone does not reliably schedule the Copy task.
def originalLevelMap = file('../../Data/Sprites/maps/level1.jpg')
if (!originalLevelMap.isFile()) {
    throw new GradleException("Original game asset missing: ${originalLevelMap}")
}
// Experimental full-resource APK for later Pomme/game engine integration.
// Default keeps the quick asset-preview build small and unchanged.
def fullGameAssets = providers.gradleProperty('fullGameAssets').map { it.toBoolean() }.getOrElse(false)
def gameplayBuild = providers.gradleProperty('gameplayProbe').map { it.toBoolean() }.getOrElse(false)
// Prevent accidental shipping of the preview/smoke-test executable or a
// gameplay APK without its original resources. Release remains unsigned
// until the owner supplies proper signing and commercial distribution rights.
def requestedRelease = gradle.startParameter.taskNames.any { it.toLowerCase(java.util.Locale.ROOT).contains('release') }
if (requestedRelease && (!gameplayBuild || !fullGameAssets)) {
    throw new GradleException('Refusing incomplete Nanosaur Android release: use -PgameplayProbe=true -PfullGameAssets=true')
}

def generatedAssetRoot = layout.buildDirectory.dir(
    fullGameAssets ? 'generated/nanosaur-full-assets' : 'generated/nanosaur-assets')

def stagePreviewAssets = tasks.register('stageNanosaurPreviewAssets', Copy) {
    if (fullGameAssets) {
        from(file('../../Data')) {
            into 'Data'
        }
        // Keep the preview path available while game engine expects Data/.
        from(originalLevelMap) {
            into 'Sprites/maps'
        }
    } else {
        from(originalLevelMap) {
            into 'Sprites/maps'
        }
    }
    // Preserve complete license terms and modification/author attribution
    // within each APK (including copies shared without a storefront).
    from(file('../../LICENSE.md')) {
        into 'licenses'
    }
    from(file('../NOTICE-ANDROID.txt')) {
        into 'licenses'
    }
    into(generatedAssetRoot)
    doLast {
        def staged = new File(generatedAssetRoot.get().asFile, 'Sprites/maps/level1.jpg')
        if (!staged.isFile() || staged.length() == 0) {
            throw new GradleException("Nanosaur preview asset staging failed: ${staged}")
        }
        if (fullGameAssets) {
            def systemDir = new File(generatedAssetRoot.get().asFile, 'Data/System')
            if (!systemDir.isDirectory()) {
                throw new GradleException("Original game system resources missing: ${systemDir}")
            }

            // APK AssetManager cannot enumerate our nested resources reliably
            // through SDL's desktop filesystem APIs. Supply a deterministic
            // newline-delimited manifest for one-time native extraction.
            def dataDir = file('../../Data')
            def paths = []
            fileTree(dataDir).visit { element ->
                if (!element.isDirectory()) {
                    paths.add(element.relativePath.pathString.replace('\\', '/'))
                }
            }
            paths.sort()
            if (!paths.contains('System/gamecontrollerdb.txt')) {
                throw new GradleException("Required game controller database missing")
            }
            def manifest = new File(generatedAssetRoot.get().asFile, 'nanosaur-data-files.txt')
            manifest.setText(paths.join('\n') + '\n', 'UTF-8')
            // Fingerprint actual file CONTENT, not only filenames. Android
            // app-private extracted assets must refresh when APK data changes.
            def digest = java.security.MessageDigest.getInstance('SHA-256')
            paths.each { path ->
                digest.update(path.getBytes('UTF-8'))
                digest.update((byte) 0)
                new File(dataDir, path).withInputStream { stream ->
                    byte[] chunk = new byte[16384]
                    int n
                    while ((n = stream.read(chunk)) != -1) {
                        digest.update(chunk, 0, n)
                    }
                }
            }
            def fingerprint = digest.digest().collect { String.format('%02x', it & 0xff) }.join('')
            new File(generatedAssetRoot.get().asFile, 'nanosaur-data-version.txt')
                .setText(fingerprint + '\n', 'UTF-8')
            logger.lifecycle("Nanosaur resource manifest contains ${paths.size()} files")
        }
        logger.lifecycle("Nanosaur assets staged (fullGameAssets=${fullGameAssets}): ${generatedAssetRoot.get().asFile}")
    }
}

android {
    namespace 'com.innovatenestlabs.nanosaur2'
    compileSdk 36

    defaultConfig {
        applicationId 'com.innovatenestlabs.nanosaur2'
        minSdk 24
        targetSdk 36
        versionCode 20005
        versionName '2.0.5'

        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared', '-DNANOSAUR_ENGINE_PROBE=' + (providers.gradleProperty('engineProbe').map { it.toBoolean() }.getOrElse(false) ? 'ON' : 'OFF'), '-DNANOSAUR_RENDERER_PROBE=' + (providers.gradleProperty('rendererProbe').map { it.toBoolean() }.getOrElse(false) ? 'ON' : 'OFF'), '-DNANOSAUR_GAMEPLAY_PROBE=' + (providers.gradleProperty('gameplayProbe').map { it.toBoolean() }.getOrElse(false) ? 'ON' : 'OFF'), '-DNANOSAUR_ANDROID_QUICKPLAY=' + (providers.gradleProperty('quickPlay').map { it.toBoolean() }.getOrElse(false) ? 'ON' : 'OFF'), '-DNANOSAUR_ANDROID_SKIP_STARTUP_CUTSCENES=' + (providers.gradleProperty('skipIntro').map { it.toBoolean() }.getOrElse(false) ? 'ON' : 'OFF')
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    sourceSets {
        main {
            // SDL3 Java code and C++ library must share the exact SDL3 revision.
            java.srcDir new File(sdlRoot, 'android-project/app/src/main/java')
            assets.srcDir(generatedAssetRoot)
        }
    }
}

// The generated source root is registered above, but it must be populated
// before Android's asset merger runs.
tasks.named('preBuild').configure {
    dependsOn(stagePreviewAssets)
}
tasks.configureEach { task ->
    if (task.name.startsWith('merge') && task.name.endsWith('Assets')) {
        task.dependsOn(stagePreviewAssets)
    }
}
