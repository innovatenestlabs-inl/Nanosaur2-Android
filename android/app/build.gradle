plugins {
    id 'com.android.application'
}

def sdlRoot = file('../SDL')
if (!new File(sdlRoot, 'CMakeLists.txt').isFile()) {
    throw new GradleException('SDL3 is missing. From the repository root, run: powershell -ExecutionPolicy Bypass -File android/setup-sdl.ps1')
}

// Package a real, unmodified Nanosaur 2 resource for the next graphics test.
// Gradle stages the original file at build time; no duplicate asset is committed.
def originalLevelMap = file('../../Data/Sprites/maps/level1.jpg')
if (!originalLevelMap.isFile()) {
    throw new GradleException("Original game asset missing: ${originalLevelMap}")
}
def stagePreviewAssets = tasks.register('stageNanosaurPreviewAssets', Copy) {
    from(originalLevelMap) {
        into 'Sprites/maps'
    }
    into(layout.buildDirectory.dir('generated/nanosaur-assets'))
}

android {
    namespace 'com.innovatenestlabs.nanosaur2'
    compileSdk 35

    defaultConfig {
        applicationId 'com.innovatenestlabs.nanosaur2'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '0.2.0-dev'

        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared'
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    sourceSets {
        main {
            // SDL3 Java code and C++ library must share the exact SDL3 revision.
            java.srcDir new File(sdlRoot, 'android-project/app/src/main/java')
            assets.srcDir(stagePreviewAssets)
        }
    }
}
