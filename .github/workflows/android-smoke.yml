name: Android SDL3 smoke build

on:
  push:
    branches: [android-port]
  workflow_dispatch:

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Check out game and Pomme
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK and command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 cmake;3.22.1 ndk;27.2.12479018'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Clone pinned SDL3
        run: |
          git clone --depth 1 --branch release-3.2.8 https://github.com/libsdl-org/SDL.git android/SDL
          test "$(git -C android/SDL rev-parse HEAD)" = "f6864924f76e1a0b4abaefc76ae2ed22b1a8916e"

      - name: Assemble debug APK
        run: gradle -p android :app:assembleDebug -PfullGameAssets=true --stacktrace

      - name: Verify original game asset packaged in APK
        run: |
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -F 'assets/Sprites/maps/level1.jpg'
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -F 'assets/Data/System/gamecontrollerdb.txt'
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -F 'assets/nanosaur-data-files.txt'

      # Do not treat an up-to-date Gradle task as proof that native game
      # source code was compiled. Invoke the CMake object target explicitly.
      - name: Compile original game engine objects (experimental)
        continue-on-error: true
        run: |
          gradle -p android :app:assembleDebug -PfullGameAssets=true -PengineProbe=true --stacktrace
          build_file="$(find android/app/.cxx/Debug -type f -name build.ninja -print -quit)"
          if [ -z "$build_file" ]; then
            echo "Couldn't find Android CMake/Ninja build directory"
            exit 1
          fi
          echo "Compiling original game engine in $(dirname "$build_file")"
          cmake --build "$(dirname "$build_file")" --target nanosaur-engine-probe --parallel 2


      - name: Upload smoke-test APK
        uses: actions/upload-artifact@v4
        with:
          name: nanosaur2-android-asset-preview-arm64
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
